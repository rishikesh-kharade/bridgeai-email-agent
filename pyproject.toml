[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bridgeai-email-assistant"
version = "2.0.0"
description = "A local AI email assistant with Google integrations"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi",
  "uvicorn",
  "pydantic",
  "pydantic-settings",
  "python-dotenv",
  "google-genai",
  "google-api-python-client",
  "google-auth-httplib2",
  "google-auth-oauthlib",
  "langgraph",
  "email-validator",
]

[project.optional-dependencies]
dev = ["pytest", "httpx"]

[project.scripts]
bridgeai = "app.cli:main"

[tool.setuptools]
packages = [
  "app",
  "app.agents",
  "app.api",
  "app.api.routes",
  "app.core",
  "app.integrations",
  "app.integrations.email",
  "app.integrations.google",
  "app.integrations.calendar",
  "app.integrations.tasks",
  "app.schemas",
  "app.services",
  "app.prompts",
]

[tool.setuptools.package-data]
app = ["static/*.html", "static/react-ui/*.html", "static/react-ui/assets/*"]
